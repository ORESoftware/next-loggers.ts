name: Semantic reconcile comprehensive observability

on:
  push:
    branches:
      - agent/otel-observability-tests-v3
    paths:
      - .github/workflows/semantic-next-loggers-merge.yml

permissions:
  contents: write

concurrency:
  group: semantic-next-loggers-pr-6
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile main and the comprehensive observability branch
        env:
          EXPECTED_MAIN: 4980707c51fdf4ff0fe4da2d5555492400b823c3
          BRANCH_NAME: agent/otel-observability-tests-v3
        run: |
          set -euo pipefail

          workflow_head="$(git rev-parse HEAD)"
          original_head="$(git rev-parse HEAD^)"
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"

          test "$actual_main" = "$EXPECTED_MAIN" || {
            echo "main moved: expected $EXPECTED_MAIN, found $actual_main" >&2
            exit 23
          }

          git show "$original_head:.zpkg.toml" > /tmp/branch.zpkg.toml
          git show "$original_head:package.json" > /tmp/branch.package.json
          git show "$original_head:scripts/test-polyglot.mjs" > /tmp/branch.test-polyglot.mjs
          git show "$original_head:src/otel.ts" > /tmp/branch.otel.ts
          git show "$original_head:tests/otel-hardening.test.mjs" > /tmp/branch.otel-hardening.test.mjs

          git show "$actual_main:.zpkg.toml" > /tmp/main.zpkg.toml
          git show "$actual_main:package.json" > /tmp/main.package.json
          git show "$actual_main:scripts/test-polyglot.mjs" > /tmp/main.test-polyglot.mjs
          git show "$actual_main:src/otel.ts" > /tmp/main.otel.ts
          git show "$actual_main:tests/otel.test.mjs" > /tmp/main.otel.test.mjs

          # Remove the one-shot workflow commit from the final history. The
          # force-with-lease below is pinned to workflow_head, so concurrent
          # branch changes cannot be overwritten.
          git reset --hard "$original_head"
          git merge --no-commit --no-ff "$actual_main" || true

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # Keep the current multi-target release manifest and add the
          # observability branch's language/runtime discovery keywords.
          zpkg = read("/tmp/main.zpkg.toml")
          match = re.search(r"keywords = \[\n(?P<body>.*?)\n\]", zpkg, re.S)
          if not match:
              raise RuntimeError("could not locate .zpkg.toml keyword array")
          body = match.group("body")
          missing_keywords = ["wasm", "rust", "go", "gleam", "java", "erlang", "elixir", "dart"]
          existing = set(re.findall(r'"([^"]+)"', body))
          additions = "".join(f'\n  "{keyword}",' for keyword in missing_keywords if keyword not in existing)
          zpkg = zpkg[:match.end("body")] + additions + zpkg[match.end("body"):]
          write(".zpkg.toml", zpkg)

          # Preserve current staged/native packaging and CLI release scripts,
          # while adding all public observability entry points and contracts.
          main_package = json.loads(read("/tmp/main.package.json"))
          branch_package = json.loads(read("/tmp/branch.package.json"))
          for key in ("./prometheus", "./loki", "./wasm", "./observability"):
              main_package["exports"][key] = branch_package["exports"][key]
          main_package["scripts"]["test:contracts"] = branch_package["scripts"]["test:contracts"]
          main_package["scripts"]["test:all"] = (
              "npm test && npm run test:contracts && "
              "npm run test:runtimes && npm run test:polyglot"
          )
          for keyword in branch_package.get("keywords", []):
              if keyword not in main_package["keywords"]:
                  main_package["keywords"].append(keyword)
          write("package.json", json.dumps(main_package, indent=2) + "\n")

          # The branch has the new Rust-OTEL and adversarial Dart lanes; main
          # has the newer Ruby lane. Keep all of them.
          polyglot = read("/tmp/branch.test-polyglot.mjs")
          if "name: 'Ruby'" not in polyglot:
              ruby = """  {
              name: 'Ruby',
              command: process.env.RUBY || 'ruby',
              args: ['test/next_loggers_test.rb'],
              cwd: path.join(root, 'sdk', 'ruby'),
            },
          """
              marker = "  {\n    name: 'Erlang',"
              polyglot = replace_once(polyglot, marker, ruby + marker, "Ruby polyglot insertion")
          write("scripts/test-polyglot.mjs", polyglot)

          # Start from main's stricter W3C identifier validation, sampled-out
          # correlation, bounded attribute count/name/value handling, remote
          # context support, and cardinality guards. Then add the branch's
          # explicit span lifecycle API and compatibility aliases.
          otel = read("/tmp/main.otel.ts")
          branch_otel = read("/tmp/branch.otel.ts")

          otel = replace_once(
              otel,
              "import type {\n  LogContextProvider,\n  LogLevel,",
              "import type {\n  BaseLogger,\n  LogContextProvider,\n  LogFields,\n  LogLevel,",
              "OTEL imports",
          )
          otel = replace_once(
              otel,
              "  setStatus?(status: { code: number; message?: string }): unknown;\n}",
              "  setStatus?(status: { code: number; message?: string }): unknown;\n"
              "  end?(endTime?: Date | number): void;\n}",
              "OtelSpanLike.end",
          )

          span_type_start = branch_otel.index("export interface OtelStartSpanOptions")
          span_type_end = branch_otel.index("export interface OtelLogRecordLike", span_type_start)
          span_types = branch_otel[span_type_start:span_type_end]
          otel = replace_once(
              otel,
              "export interface OtelLogRecordLike",
              span_types + "export interface OtelLogRecordLike",
              "span type insertion",
          )

          lifecycle_type_start = branch_otel.index("export interface WithOpenTelemetrySpanOptions")
          lifecycle_type_end = branch_otel.index("const SEVERITY_NUMBER", lifecycle_type_start)
          lifecycle_types = branch_otel[lifecycle_type_start:lifecycle_type_end]
          otel = replace_once(
              otel,
              "const SEVERITY_NUMBER",
              lifecycle_types + "const SEVERITY_NUMBER",
              "lifecycle options insertion",
          )

          otel = replace_once(
              otel,
              "  /** Primitive array items retained per attribute. Defaults to 64. */\n"
              "  maxArrayLength?: number;\n}",
              "  /** Primitive array items retained per attribute. Defaults to 64. */\n"
              "  maxArrayLength?: number;\n"
              "  /** Compatibility alias for maxAttributeValueLength. */\n"
              "  maxAttributeLength?: number;\n"
              "  /** Compatibility alias for maxArrayLength. */\n"
              "  maxAttributeArrayLength?: number;\n}",
              "attribute aliases",
          )

          otel = replace_once(
              otel,
              "  /** Optional diagnostic hook for bridge side effects other than logger.emit(). */\n"
              "  onBridgeError?: (error: unknown, operation: string) => void;\n}",
              "  /** Optional diagnostic hook for bridge side effects other than logger.emit(). */\n"
              "  onBridgeError?: (error: unknown, operation: string) => void;\n"
              "  /** Stable metric attribute allowlist for resource attributes. */\n"
              "  metricAttributeKeys?: readonly string[];\n"
              "  /** Fail open by default; set false in validation environments. */\n"
              "  failOpen?: boolean;\n"
              "  /** Operation-specific diagnostic callback including the source record. */\n"
              "  onError?: (error: unknown, operation: string, record: LogRecord) => void;\n}",
              "transport compatibility options",
          )

          level_start = branch_otel.index("const LEVEL_METHOD")
          level_end = branch_otel.index("const ERROR_LEVELS", level_start)
          level_method = branch_otel[level_start:level_end]
          otel = replace_once(
              otel,
              "const ERROR_LEVELS",
              level_method + "const ERROR_LEVELS",
              "level method insertion",
          )

          noop_start = branch_otel.index("const NOOP_SPAN")
          noop_end = branch_otel.index("function traceStateText", noop_start)
          noop_span = branch_otel[noop_start:noop_end]
          otel = replace_once(
              otel,
              "function traceStateText",
              noop_span + "function traceStateText",
              "noop span insertion",
          )

          normalized_limits = """
          function normalizedAttributeLimits(options: OtelAttributeLimits): OtelAttributeLimits {
            return {
              maxAttributes: options.maxAttributes,
              maxAttributeValueLength:
                options.maxAttributeValueLength ?? options.maxAttributeLength,
              maxArrayLength: options.maxArrayLength ?? options.maxAttributeArrayLength,
            };
          }

          """
          otel = replace_once(
              otel,
              "class AttributeBuilder",
              normalized_limits + "class AttributeBuilder",
              "attribute limit normalization",
          )
          otel = otel.replace(
              "new AttributeBuilder(options)",
              "new AttributeBuilder(normalizedAttributeLimits(options))",
          )
          otel = replace_once(
              otel,
              "      'maxAttributeValueLength' | 'maxArrayLength'\n",
              "      'maxAttributeValueLength' | 'maxArrayLength' |\n"
              "      'maxAttributeLength' | 'maxAttributeArrayLength'\n",
              "attribute option Pick",
          )

          default_metric_attributes = """const DEFAULT_METRIC_ATTRIBUTE_KEYS = new Set([
            'deployment.environment',
            'deployment.environment.name',
            'service.namespace',
            'service.version',
          ]);

          """
          otel = replace_once(
              otel,
              "const FORBIDDEN_METRIC_ATTRIBUTES",
              default_metric_attributes + "const FORBIDDEN_METRIC_ATTRIBUTES",
              "default metric attributes",
          )

          old_metric_loop = """  for (const [key, value] of Object.entries(options.metricAttributes ?? {})) {
            if (FORBIDDEN_METRIC_ATTRIBUTES.has(key) || key.startsWith('next_logger.field.')) {
              continue;
            }
            builder.set(key, value);
          }
          """
          new_metric_loop = """  const explicitMetricAttributes = options.metricAttributes ?? {};
            for (const [key, value] of Object.entries(explicitMetricAttributes)) {
              if (FORBIDDEN_METRIC_ATTRIBUTES.has(key) || key.startsWith('next_logger.field.')) {
                continue;
              }
              builder.set(key, value);
            }
            const allowedResourceKeys = new Set(
              options.metricAttributeKeys ?? DEFAULT_METRIC_ATTRIBUTE_KEYS,
            );
            for (const [key, value] of Object.entries(options.attributes ?? {})) {
              if (
                !allowedResourceKeys.has(key) ||
                FORBIDDEN_METRIC_ATTRIBUTES.has(key) ||
                key.startsWith('next_logger.field.')
              ) {
                continue;
              }
              builder.set(key, value);
            }
          """
          otel = replace_once(
              otel,
              old_metric_loop,
              new_metric_loop,
              "metric attribute union",
          )

          transport_reporter = """
          function reportTransportError(
            options: OpenTelemetryTransportOptions,
            error: unknown,
            operation: string,
            record: LogRecord,
            bridgeOperation: string = operation,
            primary = false,
          ): void {
            reportDiagnostic(options.onBridgeError, error, bridgeOperation);
            try {
              options.onError?.(error, operation, record);
            } catch {
              // A diagnostic sink must not become a recursive telemetry failure.
            }
            if (primary && options.failOpen === false) {
              throw error;
            }
          }

          """
          otel = replace_once(
              otel,
              "function traceStateText",
              transport_reporter + "function traceStateText",
              "transport reporter",
          )

          # Keep main's bridge-operation names for existing diagnostics and add
          # the branch's human-readable onError operation names.
          replacements = {
              "reportDiagnostic(this.options.onBridgeError, error, 'active-span');":
                  "reportTransportError(this.options, error, 'read active span', record, 'active-span');",
              "reportDiagnostic(this.options.onBridgeError, error, 'span-context');":
                  "reportTransportError(this.options, error, 'read span context', record, 'span-context');",
              "reportDiagnostic(this.options.onBridgeError, error, 'active-context');":
                  "reportTransportError(this.options, error, 'read active context', record, 'active-context');",
              "reportDiagnostic(this.options.onBridgeError, error, 'span-event');":
                  "reportTransportError(this.options, error, 'add span event', record, 'span-event');",
              "reportDiagnostic(this.options.onBridgeError, error, 'record-exception');":
                  "reportTransportError(this.options, error, 'record exception', record, 'record-exception');",
              "reportDiagnostic(this.options.onBridgeError, error, 'span-status');":
                  "reportTransportError(this.options, error, 'set span status', record, 'span-status');",
          }
          for old, new in replacements.items():
              otel = replace_once(otel, old, new, old)

          otel = replace_once(
              otel,
              "(error) => reportDiagnostic(this.options.onBridgeError, error, 'trace-state'),",
              "(error) => reportTransportError(\n"
              "        this.options,\n"
              "        error,\n"
              "        'serialize trace state',\n"
              "        record,\n"
              "        'trace-state',\n"
              "      ),",
              "trace-state reporter",
          )

          emit_pattern = re.compile(
              r"    this\.options\.logger\.emit\(\{\n"
              r"(?P<body>.*?)"
              r"    \}\);\n",
              re.S,
          )
          emit_match = emit_pattern.search(otel)
          if not emit_match:
              raise RuntimeError("could not locate primary OTEL emit")
          emit_body = emit_match.group("body")
          emit_replacement = (
              "    try {\n"
              "      this.options.logger.emit({\n"
              + emit_body.replace("      ", "        ", 1)
              + "      });\n"
              "    } catch (error) {\n"
              "      reportTransportError(\n"
              "        this.options,\n"
              "        error,\n"
              "        'emit log',\n"
              "        record,\n"
              "        'emit-log',\n"
              "        true,\n"
              "      );\n"
              "    }\n"
          )
          otel = otel[:emit_match.start()] + emit_replacement + otel[emit_match.end():]

          old_metrics = """    const labels = metricAttributes(record, this.options);
            try {
              this.options.recordMetric?.('next_loggers.records', 1, labels);
              if (ERROR_LEVELS.has(record.level)) {
                this.options.recordMetric?.('next_loggers.errors', 1, labels);
              }
            } catch (error) {
              reportDiagnostic(this.options.onBridgeError, error, 'metric');
            }
          """
          new_metrics = """    const labels = metricAttributes(record, this.options);
            if (this.options.recordMetric) {
              try {
                this.options.recordMetric('next_loggers.records', 1, labels);
              } catch (error) {
                reportTransportError(
                  this.options,
                  error,
                  'record log metric',
                  record,
                  'metric',
                );
              }
              if (ERROR_LEVELS.has(record.level)) {
                try {
                  this.options.recordMetric('next_loggers.errors', 1, labels);
                } catch (error) {
                  reportTransportError(
                    this.options,
                    error,
                    'record error metric',
                    record,
                    'metric',
                  );
                }
              }
            }
          """
          otel = replace_once(otel, old_metrics, new_metrics, "metric operation split")

          helper_start = branch_otel.index("function normalizeLifecycleLevel")
          helper = branch_otel[helper_start:]
          if "export async function withOpenTelemetrySpan" not in helper:
              raise RuntimeError("span lifecycle helper extraction failed")
          otel = otel.rstrip() + "\n\n" + helper.lstrip()
          write("src/otel.ts", otel)

          # Main's prior test treated primary OTEL delivery as fail-closed by
          # default. The combined contract is application-safe by default with
          # an explicit strict validation mode.
          main_test = read("/tmp/main.otel.test.mjs")
          old_primary = """  const primary = createOpenTelemetryTransport({
            logger: {
              emit() {
                throw new Error('collector down');
              },
            },
          });
          assert.throws(() => primary.write(record()), /collector down/);
          """
          new_primary = """  const primaryFailures = [];
            const primary = createOpenTelemetryTransport({
              logger: {
                emit() {
                  throw new Error('collector down');
                },
              },
              onError: (error, operation) => primaryFailures.push([operation, error.message]),
            });
            assert.doesNotThrow(() => primary.write(record()));
            assert.deepEqual(primaryFailures, [['emit log', 'collector down']]);

            const strictPrimary = createOpenTelemetryTransport({
              logger: {
                emit() {
                  throw new Error('collector down');
                },
              },
              failOpen: false,
            });
            assert.throws(() => strictPrimary.write(record()), /collector down/);
          """
          main_test = replace_once(
              main_test,
              old_primary,
              new_primary,
              "primary OTEL delivery policy test",
          )
          main_test = replace_once(
              main_test,
              "    ['metric', 'metric unavailable'],\n",
              "    ['metric', 'metric unavailable'],\n"
              "    ['metric', 'metric unavailable'],\n",
              "separate metric diagnostics",
          )
          write("tests/otel.test.mjs", main_test)

          hardening_test = read("/tmp/branch.otel-hardening.test.mjs")
          hardening_test = replace_once(
              hardening_test,
              "  assert.match(attributes['next_logger.field.large'], /truncated/);\n",
              "  assert.ok(String(attributes['next_logger.field.large']).length <= 32);\n",
              "bounded attribute assertion",
          )
          write("tests/otel-hardening.test.mjs", hardening_test)
          PY

          unresolved="$(git diff --name-only --diff-filter=U)"
          test -z "$unresolved" || {
            echo "unresolved paths:" >&2
            printf '%s\n' "$unresolved" >&2
            exit 24
          }

          git add -A
          git diff --cached --check

          npm ci
          npm run typecheck
          npm test
          npm run test:contracts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Semantically reconcile comprehensive observability with current main

          Preserve the multi-target packaging, release tooling, W3C correlation validation,
          sampled-out trace linkage, cardinality controls, and all intervening mainline work.
          Add the comprehensive Prometheus, Loki, WASM, browser streaming, explicit span
          lifecycle, polyglot adversarial, and observability contract suite from PR #6."

          git push \
            --force-with-lease="refs/heads/$BRANCH_NAME:$workflow_head" \
            origin "HEAD:refs/heads/$BRANCH_NAME"
