name: Refine Go lifecycle audit patterns

on:
  push:
    branches:
      - agent/polyglot-context-shutdown-20260808

permissions:
  contents: write

concurrency:
  group: refine-lifecycle-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tighten Go graceful and telemetry evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit-server-lifecycle.mjs')
          text = path.read_text()
          replacements = {
              "graceful: [/\\.Shutdown\\s*\\(\\s*ctx/, /GracefulStop\\s*\\(/],":
                  "graceful: [/\\.Shutdown\\s*\\(/, /GracefulStop\\s*\\(/],",
              "flush: [/\\bFlush\\s*\\(/, /ForceFlush\\s*\\(/, /Shutdown\\s*\\(.*context/is],":
                  "flush: [/\\bFlush\\s*\\(/, /ForceFlush\\s*\\(/, /\\b(?:tracer|meter|logger|telemetry|provider)\\w*\\.Shutdown\\s*\\(/i],",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected pattern not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm -f .github/workflows/refine-lifecycle-audit-go-patterns.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(audit): distinguish Go server shutdown from telemetry flush"
          git push origin HEAD:${GITHUB_REF_NAME}
