name: Format polyglot Gleam hardening

on:
  push:
    branches:
      - agent/polyglot-context-shutdown-20260808

permissions:
  contents: write

concurrency:
  group: format-polyglot-gleam-hardening
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.17.0"

      - name: Format Gleam sources and tests
        working-directory: sdk/gleam
        run: gleam format src test

      - name: Commit canonical formatter output
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-polyglot-gleam.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: format Gleam context hardening"
          git push origin "HEAD:${GITHUB_REF_NAME}"
