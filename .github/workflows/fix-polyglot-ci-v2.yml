name: Repair polyglot context lifecycle gates

on:
  push:
    branches:
      - agent/polyglot-context-shutdown-20260808

permissions:
  contents: write

concurrency:
  group: repair-polyglot-context-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply deterministic source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          go_path = Path("sdk/go/context_test.go")
          go_text = go_path.read_text()
          old_go = '''\tif value, exists := transport.Records[0].Fields["otel.trace_flags"]; !exists || value != byte(0) {
\t\tt.Fatalf("explicit zero trace flags missing from record: %#v", transport.Records[0].Fields)
\t}
'''
          new_go = '''\tvalue, exists := transport.Records[0].Fields["otel.trace_flags"]
\ttraceFlags, numeric := value.(float64)
\tif !exists || !numeric || traceFlags != 0 {
\t\tt.Fatalf("explicit zero trace flags missing from record: %#v", transport.Records[0].Fields)
\t}
'''
          if old_go in go_text:
              go_path.write_text(go_text.replace(old_go, new_go, 1))
          elif new_go not in go_text:
              raise SystemExit("Go trace-flags assertion was not in an expected state")

          dart_path = Path("sdk/dart/lib/next_loggers.dart")
          lines = dart_path.read_text().splitlines()
          output = []
          flush_count = 0
          exit_flush_count = 0
          close_count = 0

          for line in lines:
              stripped = line.strip()
              indent = line[: len(line) - len(line.lstrip())]
              if stripped == "await transport.flush();":
                  output.append(indent + "final flushable = transport as FlushableLogTransport;")
                  output.append(indent + "await flushable.flush();")
                  flush_count += 1
              elif stripped == "await transport.flushOnExit(unsent);":
                  output.append(indent + "final exitFlushable = transport as ExitFlushableLogTransport;")
                  output.append(indent + "await exitFlushable.flushOnExit(unsent);")
                  exit_flush_count += 1
              elif stripped == "await transport.close();":
                  output.append(indent + "final closable = transport as ClosableLogTransport;")
                  output.append(indent + "await closable.close();")
                  close_count += 1
              else:
                  output.append(line)

          actual = (flush_count, exit_flush_count, close_count)
          if actual == (2, 1, 1):
              dart_path.write_text("\n".join(output) + "\n")
          elif actual != (0, 0, 0):
              raise SystemExit(f"unexpected Dart replacement counts: {actual}")
          PY

          gofmt -w sdk/go/context_test.go

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust context SDK
        run: cargo fmt --manifest-path sdk/rust-context/Cargo.toml

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Format Dart SDK
        run: dart format sdk/dart/lib sdk/dart/test

      - name: Commit deterministic repairs and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-polyglot-ci-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy polyglot context lifecycle gates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
