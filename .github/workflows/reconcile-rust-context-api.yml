name: Reconcile Rust context extension API

on: push

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref_name == 'agent/polyglot-context-shutdown-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rename shadowed explicit-context extension methods
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('sdk/rust-context/src/lib.rs')
          text = lib.read_text()
          for level in ('trace', 'debug', 'info', 'warn', 'error', 'fatal'):
              old = f'fn {level}_context(&self, context: &LogContext, values: Vec<Value>) -> Event'
              new = f'fn {level}_with_context(&self, context: &LogContext, values: Vec<Value>) -> Event'
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise RuntimeError(f'Rust context method {level} is in an unexpected state')
          lib.write_text(text)

          test = Path('sdk/rust-context/tests/context.rs')
          text = test.read_text()
          old = '.info_context(&context, vec![json!("hello")])'
          new = '.info_with_context(&context, vec![json!("hello")])'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise RuntimeError('Rust explicit-context test call is in an unexpected state')
          test.write_text(text)

          readme = Path('sdk/rust-context/README.md')
          text = readme.read_text()
          old = '- `LoggerContextExt` adds explicit (`info_context`) and ambient\n  (`info_ambient`) event constructors.'
          new = '- `LoggerContextExt` adds explicit (`info_with_context`) and ambient\n  (`info_ambient`) event constructors without colliding with the canonical SDK’s\n  inherent `info_context(values)` ambient API.'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise RuntimeError('Rust context README is in an unexpected state')
          readme.write_text(text)

          docs = Path('docs/context-and-shutdown.md')
          text = docs.read_text()
          old = '- logger extension methods for explicit and ambient context.'
          new = '- logger extension methods for explicit (`*_with_context`) and ambient\n  (`*_ambient`) context.'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise RuntimeError('Rust context documentation is in an unexpected state')
          docs.write_text(text)
          PY

          cargo fmt --manifest-path sdk/rust-context/Cargo.toml
          if git grep -n 'info_context(&' -- sdk/rust-context docs; then
            echo 'shadowed explicit-context call remains' >&2
            exit 1
          fi

      - name: Validate both Rust context implementations
        run: |
          set -euo pipefail
          cargo test --manifest-path sdk/rust/Cargo.toml
          cargo test --manifest-path sdk/rust-context/Cargo.toml
          cargo test --manifest-path sdk/rust-context/Cargo.toml --features tokio
          git diff --check

      - name: Commit validated reconciliation
        run: |
          set -euo pipefail
          paths=(
            sdk/rust-context/src/lib.rs
            sdk/rust-context/tests/context.rs
            sdk/rust-context/README.md
            docs/context-and-shutdown.md
          )
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo 'Rust context API is already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rust): disambiguate explicit context extension methods'
          git push origin "HEAD:${GITHUB_REF_NAME}"
