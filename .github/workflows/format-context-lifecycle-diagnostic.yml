name: Context lifecycle formatter diagnostic

on: push

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Print Rust formatter diff
        shell: bash
        run: cargo fmt --manifest-path sdk/rust-context/Cargo.toml -- --check || true

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Print canonical Dart formatter output
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            sdk/dart/lib/next_loggers.dart \
            sdk/dart/lib/shutdown.dart \
            sdk/dart/test/context_shutdown.dart
          do
            echo "::group::${file}"
            dart format --output=show "${file}"
            echo "::endgroup::"
          done
