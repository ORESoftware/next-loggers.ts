name: Build validated context lifecycle repair

on: push

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Apply deterministic source repairs
        run: |
          set -euo pipefail
          python3 tools/build_context_lifecycle_repair.py
          gofmt -w sdk/go/context_test.go
          cargo fmt --manifest-path sdk/rust-context/Cargo.toml
          dart format \
            sdk/dart/lib/next_loggers.dart \
            sdk/dart/lib/shutdown.dart \
            sdk/dart/test/context_shutdown.dart

      - name: Validate repaired runtimes
        run: |
          set -euo pipefail
          (cd sdk/go && go test ./...)
          cargo test --manifest-path sdk/rust-context/Cargo.toml
          cargo test --manifest-path sdk/rust-context/Cargo.toml --features tokio
          (
            cd sdk/dart
            dart pub get
            dart analyze
            dart run test/context_shutdown.dart
          )
          git diff --check
          git diff --stat

      - name: Commit validated source repairs
        if: github.ref_name == 'agent/polyglot-context-shutdown-20260808'
        run: |
          set -euo pipefail
          paths=(
            sdk/go/context_test.go
            sdk/rust-context/src/lib.rs
            sdk/rust-context/tests/context.rs
            sdk/rust-context/tests/tokio_context.rs
            sdk/dart/lib/next_loggers.dart
            sdk/dart/lib/shutdown.dart
            sdk/dart/test/context_shutdown.dart
          )
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo 'Validated sources are already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(polyglot): apply validated context lifecycle repairs'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload validated source files
        uses: actions/upload-artifact@v4
        with:
          name: context-lifecycle-repair
          if-no-files-found: error
          retention-days: 1
          path: |
            sdk/go/context_test.go
            sdk/rust-context/src/lib.rs
            sdk/rust-context/tests/context.rs
            sdk/rust-context/tests/tokio_context.rs
            sdk/dart/lib/next_loggers.dart
            sdk/dart/lib/shutdown.dart
            sdk/dart/test/context_shutdown.dart
