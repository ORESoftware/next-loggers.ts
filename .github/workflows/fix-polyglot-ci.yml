name: Fix polyglot CI hardening

on:
  push:
    branches:
      - agent/polyglot-context-shutdown-20260808

permissions:
  contents: write

concurrency:
  group: fix-polyglot-ci-hardening
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply deterministic source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          go_path = Path("sdk/go/context_test.go")
          go_text = go_path.read_text()
          old_go = "if !exists || value != byte(0) {"
          if go_text.count(old_go) != 1:
              raise SystemExit(f"expected exactly one Go assertion, found {go_text.count(old_go)}")
          go_path.write_text(go_text.replace(old_go, "if !exists || value != 0 {"))

          dart_path = Path("sdk/dart/lib/next_loggers.dart")
          dart_text = dart_path.read_text()

          old_flush = """      if (transport is FlushableLogTransport) {
                await transport.flush();
              }"""
          new_flush = """      if (transport is FlushableLogTransport) {
                final flushable = transport as FlushableLogTransport;
                await flushable.flush();
              }"""
          if dart_text.count(old_flush) != 2:
              raise SystemExit(f"expected exactly two Dart flush blocks, found {dart_text.count(old_flush)}")
          dart_text = dart_text.replace(old_flush, new_flush)

          old_exit = """      if (unsent.isNotEmpty && transport is ExitFlushableLogTransport) {
                await transport.flushOnExit(unsent);
              }"""
          new_exit = """      if (unsent.isNotEmpty && transport is ExitFlushableLogTransport) {
                final exitFlushable = transport as ExitFlushableLogTransport;
                await exitFlushable.flushOnExit(unsent);
              }"""
          if dart_text.count(old_exit) != 1:
              raise SystemExit(f"expected exactly one Dart exit-flush block, found {dart_text.count(old_exit)}")
          dart_text = dart_text.replace(old_exit, new_exit)

          old_close = """      if (transport is ClosableLogTransport) {
                await transport.close();
              }"""
          new_close = """      if (transport is ClosableLogTransport) {
                final closable = transport as ClosableLogTransport;
                await closable.close();
              }"""
          if dart_text.count(old_close) != 1:
              raise SystemExit(f"expected exactly one Dart close block, found {dart_text.count(old_close)}")
          dart_text = dart_text.replace(old_close, new_close)

          dart_path.write_text(dart_text)
          PY

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust context SDK
        run: cargo fmt --manifest-path sdk/rust-context/Cargo.toml

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Format Dart SDK
        run: dart format sdk/dart/lib sdk/dart/test

      - name: Commit deterministic repairs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-polyglot-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy polyglot context lifecycle gates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
