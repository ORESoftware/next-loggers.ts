name: Fix external audit input expression

on:
  push:
    branches:
      - agent/polyglot-context-shutdown-20260808

permissions:
  contents: write

concurrency:
  group: fix-external-audit-input-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch hyphenated input access and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/server-lifecycle-audit-external.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/server-lifecycle-audit-external.yml')
          text = path.read_text()
          old = "${{ inputs.canonical-ref }}"
          new = "${{ inputs['canonical-ref'] }}"
          if old in text:
              path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/fix-external-audit-input.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): access hyphenated reusable-workflow input safely"
          git push origin HEAD:${GITHUB_REF_NAME}
