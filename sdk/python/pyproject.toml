[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oresoftware-next-loggers"
version = "0.1.0"
description = "Python implementation of the next-loggers/v1 contract"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "ORESoftware" }
]
keywords = ["logging", "structured-logging", "supabase"]

[project.urls]
Repository = "https://github.com/ORESoftware/next-loggers.ts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
next_loggers = ["py.typed"]
